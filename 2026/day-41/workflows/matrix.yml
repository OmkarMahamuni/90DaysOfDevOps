name: Matrix Builds

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Task 5 requirement
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          - os: windows-latest
            python-version: '3.10'
            
    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Print Python Version
        run: python --version
        
      - name: Intentional Failure (Fail-Fast Test)
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: exit 1
