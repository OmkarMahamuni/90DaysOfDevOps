name: Multi-Job Workflow

on: 
    workflow_dispatch:

jobs:
    
    build:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Building the app"

    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - run: echo "Running tests"
            
    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - run: echo "Deploying..."
