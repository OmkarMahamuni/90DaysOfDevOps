name: Environment Variables Demo

on: 
    workflow_dispatch:

env:
    APP_NAME: myapp

jobs: 
    show-env:
        runs-on: ubuntu-latest
        env: 
            ENVIRONMENT: Staging

        steps:
            - name: Print all the env vars
              env: 
                VERSION: 1.0.0
              run: |
                echo "APP_NAME=$APP_NAME"
                echo "ENVIRONMENT=$ENVIRONMENT"
                echo "VERSION=$VERSION"
                echo "SHA=${{ github.sha }}"
                echo "ACTOR=${{ github.actor }}"
  
