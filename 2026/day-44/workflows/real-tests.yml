name: Run Real Tests

on:
    workflow_dispatch:
    push:

jobs:
    test-script:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Run script
              run: python app.py
